<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão · Louve</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09090e;
      color: #f4f4f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 14px;
    }
    .tile {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #9c5ff1, #441782);
      display: grid;
      place-items: center;
      margin-bottom: 6px;
    }
    h1 { font-size: 19px; font-weight: 650; margin: 0; }
    p { font-size: 14.5px; color: #9a9aa6; margin: 0; max-width: 320px; line-height: 1.5; }
    button {
      margin-top: 8px;
      background: #853aee;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tile">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff">
        <rect x="3" y="9" width="2.6" height="6" rx="1.3" />
        <rect x="8" y="5" width="2.6" height="14" rx="1.3" />
        <rect x="13" y="2" width="2.6" height="20" rx="1.3" />
        <rect x="18" y="7" width="2.6" height="10" rx="1.3" />
      </svg>
    </div>
    <h1>Sem conexão no momento</h1>
    <p>Esta página precisa de internet. Assim que a conexão voltar, tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
